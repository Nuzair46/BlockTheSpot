;Spotify for Windows (64 bit)
;1.3.1.234
; Loader configuration. Each mod owns its same-named INI in patches/.
[Compatibility]
Spotify=1.3.1.234
[Log]
; 0 errors only, 1 status changes, 2 debug request decisions (URLs redacted)
Level=0
[Mods]
; Mods present in patches/ are enabled automatically. 0 disables all mods.
Enable=1
[LIBCEF]
; Process handling and ABI offsets belong to the loader.
Block_crashpad=1
CEF_REQUEST_GET_URL_OFFSET=48
CEF_ZIP_READER_GET_READ_FILE_OFFSET=112
CEF_ZIP_READER_GET_FILE_NAME_OFFSET=72
