; Copy to settings.ini next to the DLLs. Updates must preserve settings.ini.
; Unspecified values inherit config.ini. Signature bytes and offsets stay in config.ini.
[Log]
; 0 errors only, 1 status changes, 2 debug request decisions (URLs redacted)
Level=0
[Developer]
Enable=1
[URL_block]
Enable=1
[Buffer_modify]
Enable=1
[Homepage_vbar]
Enable=0
[LIBCEF]
Block_crashpad=1

; Experimental mod loader: files live in patches/ beside the DLLs.
; Restart Spotify after adding, updating, or disabling mods.
[Mods]
Enable=1
; Disable an individual mod by its filename (case insensitive):
; example.dll=0
; example.ini=0
