name: Manual Build And Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional release tag. Leave empty to auto-generate one."
        required: false
        type: string
      release_name:
        description: "Optional release name. Leave empty to use the generated default."
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the GitHub release as a draft."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
      - name: Ensure workflow runs from master
        if: github.ref_name != 'master'
        shell: pwsh
        run: |
          Write-Error "This workflow can only be run from the master branch."
          exit 1

      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $spotifyVersion = (
            Get-Content config.ini |
            Where-Object { $_ -match '^\s*Version\s*=' } |
            Select-Object -First 1
          ) -replace '^\s*Version\s*=\s*', ''
          $spotifyVersion = $spotifyVersion.Trim()
          $tag = "${{ inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "v$spotifyVersion-build.${{ github.run_number }}"
          }

          $releaseName = "${{ inputs.release_name }}"
          if ([string]::IsNullOrWhiteSpace($releaseName)) {
            $releaseName = "BlockTheSpot $spotifyVersion"
          }

          $releaseBody = @"
          Manual release built from master.

          Spotify version: $spotifyVersion
          Commit: $env:GITHUB_SHA
          Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@

          "spotify_version=$spotifyVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          $bodyPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $releaseBody | Set-Content -Path $bodyPath -NoNewline
          "body_path=$bodyPath" >> $env:GITHUB_OUTPUT

      - name: Build Release hook DLL
        shell: pwsh
        run: msbuild Hook/Hook.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:GITHUB_WORKSPACE\\"

      - name: Build Release loader DLL
        shell: pwsh
        run: msbuild Loader/Loader.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:GITHUB_WORKSPACE\\"

      - name: Package release zip
        id: package
        shell: pwsh
        run: |
          $packageDir = "dist/package"
          $patchDir = Join-Path $packageDir "patches"
          $zipPath = "dist/BlockTheSpot-${{ steps.meta.outputs.spotify_version }}.zip"

          New-Item -ItemType Directory -Force -Path $patchDir | Out-Null
          Copy-Item out/x64/Release/blockthespot.dll (Join-Path $packageDir "blockthespot.dll") -Force
          Copy-Item out/x64/Release/chrome_elf.dll (Join-Path $packageDir "chrome_elf.dll") -Force
          Copy-Item config.ini (Join-Path $packageDir "config.ini") -Force
          Copy-Item patches/native.ini (Join-Path $patchDir "native.ini") -Force
          Copy-Item patches/frontend.ini (Join-Path $patchDir "frontend.ini") -Force

          Compress-Archive -Path "$packageDir/*" -DestinationPath $zipPath -Force
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          body_path: ${{ steps.meta.outputs.body_path }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.package.outputs.zip_path }}
